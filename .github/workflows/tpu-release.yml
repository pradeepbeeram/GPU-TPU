name: Create GKE Cluster, TPU Pool, Deploy Model and Run Workload

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  ZONE: ${{ vars.GKE_ZONE }}
  TPU_POOL_NAME: ${{ vars.TPU_POOL_NAME }}

jobs:
  create-gke-and-tpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Google Cloud authentication
        run: |
          echo "Active account:"
          gcloud auth list

          echo "Active project:"
          gcloud config get-value project

      - name: Enable required APIs
        run: |
          gcloud services enable \
            container.googleapis.com \
            compute.googleapis.com \
            file.googleapis.com \
            --project="${PROJECT_ID}"

      - name: Check if GKE cluster exists
        id: cluster-check
        run: |
          if gcloud container clusters describe "${CLUSTER_NAME}" \
            --zone="${ZONE}" \
            --project="${PROJECT_ID}" >/dev/null 2>&1; then

            echo "Cluster ${CLUSTER_NAME} already exists."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Cluster ${CLUSTER_NAME} does not exist."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GKE cluster
        if: steps.cluster-check.outputs.exists == 'false'
        run: |
          echo "Creating GKE cluster ${CLUSTER_NAME}..."

          gcloud container clusters create "${CLUSTER_NAME}" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --machine-type="e2-standard-4" \
            --num-nodes="1" \
            --addons="GcpFilestoreCsiDriver"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.ZONE }}

      - name: Check if TPU node pool exists
        id: tpu-pool-check
        run: |
          if gcloud container node-pools describe "${TPU_POOL_NAME}" \
            --project="${PROJECT_ID}" \
            --cluster="${CLUSTER_NAME}" \
            --zone="${ZONE}" >/dev/null 2>&1; then

            echo "TPU node pool ${TPU_POOL_NAME} already exists."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "TPU node pool ${TPU_POOL_NAME} does not exist."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create Spot TPU node pool
        if: steps.tpu-pool-check.outputs.exists == 'false'
        run: |
          echo "Creating Spot TPU node pool ${TPU_POOL_NAME}..."

          gcloud container node-pools create "${TPU_POOL_NAME}" \
            --project="${PROJECT_ID}" \
            --cluster="${CLUSTER_NAME}" \
            --zone="${ZONE}" \
            --machine-type="ct5lp-hightpu-1t" \
            --num-nodes="1" \
            --spot \
            --enable-autoscaling \
            --total-min-nodes="0" \
            --total-max-nodes="1"

      - name: Verify GKE cluster
        run: |
          echo "===== GKE CLUSTER ====="

          gcloud container clusters describe "${CLUSTER_NAME}" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --format="table(name,status,currentMasterVersion,location)"

          echo "===== KUBERNETES NODES ====="

          kubectl get nodes -o wide

      - name: Verify TPU node pool
        run: |
          echo "===== GKE NODE POOLS ====="

          gcloud container node-pools list \
            --project="${PROJECT_ID}" \
            --cluster="${CLUSTER_NAME}" \
            --zone="${ZONE}"

          echo "The TPU pool may currently have 0 running nodes."
          echo "Deploying the model should trigger autoscaling from 0 to 1."

      - name: Validate model and trace files
        run: |
          echo "Checking repository files..."

          if [ ! -f "K8/tpu_model.yml" ]; then
            echo "ERROR: K8/tpu_model.yml was not found."
            exit 1
          fi

          if [ ! -f "Trace/tpu_trace.py" ]; then
            echo "ERROR: Trace/tpu_trace.py was not found."
            exit 1
          fi

          echo "K8/tpu_model.yml found."
          echo "Trace/tpu_trace.py found."

      - name: Deploy TPU model
        run: |
          echo "Deploying TPU model..."

          kubectl apply -f K8/tpu_model.yml

      - name: Show initial deployment status
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments

          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get services

      - name: Wait for TPU model deployment
        run: |
          echo "Waiting for tiny-model-server deployment..."

          kubectl rollout status deployment/tiny-model-server \
            --timeout=30m

      - name: Verify TPU model
        run: |
          echo "===== FINAL DEPLOYMENT STATUS ====="
          kubectl get deployments

          echo "===== FINAL POD STATUS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get services

          echo "===== TPU NODES ====="
          kubectl get nodes \
            -l cloud.google.com/gke-tpu-accelerator=tpu-v5-lite-podslice \
            -o wide

      - name: Show TPU model logs
        run: |
          echo "===== MODEL LOGS ====="

          kubectl logs deployment/tiny-model-server \
            --tail=100

      # ---------------------------------------------------------
      # TPU TRACE EXECUTION
      # ---------------------------------------------------------

      - name: Create trace results directory
        run: |
          mkdir -p Trace/results

      - name: Run TPU workload trace
        run: |
          set -e

          echo "Starting port-forward to tiny-model-service..."

          kubectl port-forward \
            service/tiny-model-service \
            8000:8000 \
            > Trace/results/port-forward.log 2>&1 &

          PORT_FORWARD_PID=$!

          cleanup() {
            echo "Stopping port-forward..."
            kill "${PORT_FORWARD_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for model endpoint..."

          ENDPOINT_READY=false

          for attempt in {1..30}; do
            if curl --silent --fail \
              http://localhost:8000/v1/models \
              > Trace/results/models-response.json; then

              echo "Model endpoint is ready."
              ENDPOINT_READY=true
              break
            fi

            echo "Attempt ${attempt}/30: endpoint is not ready."
            sleep 10
          done

          if [ "${ENDPOINT_READY}" != "true" ]; then
            echo "ERROR: Model endpoint did not become available."
            cat Trace/results/port-forward.log
            exit 1
          fi

          echo "Running TPU workload trace..."

          python3 Trace/tpu_trace.py \
            --infra tpu \
            --url http://localhost:8000/v1/chat/completions \
            | tee Trace/results/tpu-trace-console.txt

          echo "TPU workload trace completed."

      - name: Collect TPU trace result files
        if: always()
        run: |
          echo "Collecting generated result files..."

          mv results_tpu_*.json Trace/results/ 2>/dev/null || true
          mv results_tpu_*.txt Trace/results/ 2>/dev/null || true

          echo "===== TRACE RESULT FILES ====="

          find Trace/results \
            -maxdepth 1 \
            -type f \
            -print

      - name: Upload TPU trace results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpu-trace-${{ github.run_number }}
          path: Trace/results/
          retention-days: 7
          if-no-files-found: warn

      # ---------------------------------------------------------
      # DIAGNOSTICS AND SUMMARY
      # ---------------------------------------------------------

      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics

          kubectl get nodes -o wide \
            > diagnostics/nodes.txt 2>&1 || true

          kubectl get pods -A -o wide \
            > diagnostics/pods.txt 2>&1 || true

          kubectl get services -A \
            > diagnostics/services.txt 2>&1 || true

          kubectl get events -A \
            --sort-by=.metadata.creationTimestamp \
            > diagnostics/events.txt 2>&1 || true

          kubectl logs deployment/tiny-model-server \
            --tail=500 \
            > diagnostics/model-logs.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tpu-diagnostics-${{ github.run_number }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      - name: Add workflow summary
        if: always()
        run: |
          {
            echo "# GKE TPU POC Release"
            echo
            echo "## Infrastructure"
            echo
            echo "- Project: ${PROJECT_ID}"
            echo "- Cluster: ${CLUSTER_NAME}"
            echo "- Zone: ${ZONE}"
            echo "- TPU pool: ${TPU_POOL_NAME}"
            echo "- TPU machine: ct5lp-hightpu-1t"
            echo "- Spot: enabled"
            echo "- Autoscaling: 0 to 1"
            echo
            echo "## Deployment"
            echo
            echo "- Model file: K8/tpu_model.yml"
            echo "- Deployment: tiny-model-server"
            echo "- Service: tiny-model-service"
            echo
            echo "## Workload Trace"
            echo
            echo "- Trace file: Trace/tpu_trace.py"
            echo "- Infrastructure type: TPU"
            echo "- Model: Qwen/Qwen2.5-0.5B-Instruct"
            echo "- Artifact: tpu-trace-${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_STEP_SUMMARY}"
