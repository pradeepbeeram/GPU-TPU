name: Create GKE Cluster, TPU Pool and Deploy Model

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  ZONE: ${{ vars.GKE_ZONE }}
  TPU_POOL_NAME: ${{ vars.TPU_POOL_NAME }}

jobs:
  create-gke-and-tpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Google Cloud authentication
        run: |
          echo "Active account:"
          gcloud auth list

          echo "Active project:"
          gcloud config get-value project

      - name: Enable required APIs
        run: |
          gcloud services enable \
            container.googleapis.com \
            compute.googleapis.com \
            file.googleapis.com \
            --project="${PROJECT_ID}"

      - name: Check if GKE cluster exists
        id: cluster-check
        run: |
          if gcloud container clusters describe "${CLUSTER_NAME}" \
            --zone="${ZONE}" \
            --project="${PROJECT_ID}" >/dev/null 2>&1; then

            echo "Cluster ${CLUSTER_NAME} already exists."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Cluster ${CLUSTER_NAME} does not exist."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GKE cluster
        if: steps.cluster-check.outputs.exists == 'false'
        run: |
          echo "Creating GKE cluster ${CLUSTER_NAME}..."

          gcloud container clusters create "${CLUSTER_NAME}" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --machine-type="e2-standard-4" \
            --num-nodes="1" \
            --addons="GcpFilestoreCsiDriver"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.ZONE }}

      - name: Check if TPU node pool exists
        id: tpu-pool-check
        run: |
          if gcloud container node-pools describe "${TPU_POOL_NAME}" \
            --project="${PROJECT_ID}" \
            --cluster="${CLUSTER_NAME}" \
            --zone="${ZONE}" >/dev/null 2>&1; then

            echo "TPU node pool ${TPU_POOL_NAME} already exists."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "TPU node pool ${TPU_POOL_NAME} does not exist."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create Spot TPU node pool
        if: steps.tpu-pool-check.outputs.exists == 'false'
        run: |
          echo "Creating Spot TPU node pool ${TPU_POOL_NAME}..."

          gcloud container node-pools create "${TPU_POOL_NAME}" \
            --project="${PROJECT_ID}" \
            --cluster="${CLUSTER_NAME}" \
            --zone="${ZONE}" \
            --machine-type="ct5lp-hightpu-1t" \
            --num-nodes="1" \
            --spot \
            --enable-autoscaling \
            --total-min-nodes="0" \
            --total-max-nodes="1"

      - name: Verify GKE cluster
        run: |
          echo "===== GKE CLUSTER ====="

          gcloud container clusters describe "${CLUSTER_NAME}" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --format="table(name,status,currentMasterVersion,location)"

          echo "===== KUBERNETES NODES ====="

          kubectl get nodes -o wide

      - name: Verify TPU node pool
        run: |
          echo "===== GKE NODE POOLS ====="

          gcloud container node-pools list \
            --project="${PROJECT_ID}" \
            --cluster="${CLUSTER_NAME}" \
            --zone="${ZONE}"

          echo "TPU node may currently be at 0 nodes."
          echo "The model workload should trigger autoscaling from 0 to 1."

      - name: Validate TPU model file
        run: |
          echo "Checking TPU model YAML..."

          if [ ! -f "tpu_model.yml" ]; then
            echo "ERROR: tpu_model.yml not found in repository root."
            exit 1
          fi

          echo "tpu_model.yml found."

      - name: Deploy TPU model
        run: |
          echo "Deploying TPU model..."

          kubectl apply -f tpu_model.yml

      - name: Show deployment status
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments

          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get services

      - name: Wait for TPU model deployment
        run: |
          echo "Waiting for tiny-model-server deployment..."

          kubectl rollout status deployment/tiny-model-server \
            --timeout=30m

      - name: Verify TPU model
        run: |
          echo "===== FINAL DEPLOYMENT STATUS ====="
          kubectl get deployments

          echo "===== FINAL POD STATUS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get services

          echo "===== TPU NODES ====="
          kubectl get nodes \
            -l cloud.google.com/gke-tpu-accelerator=tpu-v5-lite-podslice \
            -o wide || true

      - name: Show TPU model logs
        run: |
          echo "===== MODEL LOGS ====="

          kubectl logs deployment/tiny-model-server \
            --tail=100

      - name: Add workflow summary
        if: always()
        run: |
          {
            echo "# GKE, TPU and Model Deployment"
            echo
            echo "✅ Authentication completed"
            echo
            echo "✅ GKE cluster created or already available"
            echo
            echo "✅ Kubernetes connection verified"
            echo
            echo "✅ TPU node pool created or already available"
            echo
            echo "✅ TPU model deployment attempted"
            echo
            echo "- Project: ${PROJECT_ID}"
            echo "- Cluster: ${CLUSTER_NAME}"
            echo "- Zone: ${ZONE}"
            echo "- TPU pool: ${TPU_POOL_NAME}"
            echo "- TPU machine: ct5lp-hightpu-1t"
            echo "- Spot: enabled"
            echo "- Autoscaling: 0 to 1"
            echo "- Model file: tpu_model.yml"
          } >> "${GITHUB_STEP_SUMMARY}"
