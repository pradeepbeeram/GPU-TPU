name: Create GKE Cluster, GPU Pool, Deploy Model and Run Workload

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ZONE: ${{ vars.GKE_ZONE }}
  CLUSTER_NAME: ${{ vars.GPU_CLUSTER_NAME }}
  GPU_POOL_NAME: ${{ vars.GPU_POOL_NAME }}

jobs:
  gpu-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Verify GCP Access
        run: |
          gcloud config set project $PROJECT_ID
          gcloud auth list
          gcloud config get-value project

      - name: Check GPU Cluster
        id: check-cluster
        run: |
          if gcloud container clusters describe $CLUSTER_NAME \
            --zone=$ZONE \
            --project=$PROJECT_ID >/dev/null 2>&1; then
              echo "Cluster $CLUSTER_NAME already exists"
              echo "exists=true" >> $GITHUB_OUTPUT
          else
              echo "Cluster $CLUSTER_NAME does not exist"
              echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GPU GKE Cluster
        if: steps.check-cluster.outputs.exists == 'false'
        run: |
          gcloud container clusters create $CLUSTER_NAME \
            --zone=$ZONE \
            --project=$PROJECT_ID \
            --machine-type=e2-standard-4 \
            --num-nodes=1

      - name: Enable GKE Auth Plugin
        run: |
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --zone=$ZONE \
            --project=$PROJECT_ID

      - name: Verify GKE Cluster
        run: |
          kubectl get nodes
          kubectl cluster-info

      - name: Check GPU Node Pool
        id: check-gpu-pool
        run: |
          if gcloud container node-pools describe $GPU_POOL_NAME \
            --cluster=$CLUSTER_NAME \
            --zone=$ZONE \
            --project=$PROJECT_ID >/dev/null 2>&1; then
              echo "GPU node pool $GPU_POOL_NAME already exists"
              echo "exists=true" >> $GITHUB_OUTPUT
          else
              echo "GPU node pool $GPU_POOL_NAME does not exist"
              echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GPU Node Pool
        if: steps.check-gpu-pool.outputs.exists == 'false'
        run: |
          gcloud container node-pools create $GPU_POOL_NAME \
            --cluster=$CLUSTER_NAME \
            --zone=$ZONE \
            --project=$PROJECT_ID \
            --machine-type=g2-standard-4 \
            --accelerator=type=nvidia-l4,count=1,gpu-driver-version=default \
            --enable-autoscaling \
            --num-nodes=0 \
            --min-nodes=0 \
            --max-nodes=1

      - name: Verify GPU Node Pool
        run: |
          echo "===== GPU NODE POOL ====="

          gcloud container node-pools describe $GPU_POOL_NAME \
            --cluster=$CLUSTER_NAME \
            --zone=$ZONE \
            --project=$PROJECT_ID \
            --format="yaml(name,status,autoscaling,config.machineType,config.accelerators)"

          echo "===== CURRENT KUBERNETES NODES ====="
          kubectl get nodes -o wide

      - name: Validate GPU Model File
        run: |
          echo "Checking GPU model file..."

          if [ ! -f "K8/gpu_model.yml" ]; then
            echo "ERROR: K8/gpu_model.yml was not found."
            exit 1
          fi

          echo "K8/gpu_model.yml found."

      - name: Deploy GPU Model
        run: |
          echo "Deploying GPU model..."
          kubectl apply -f K8/gpu_model.yml

      - name: Show Initial GPU Deployment Status
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments

          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get services

          echo "===== NODES ====="
          kubectl get nodes -o wide

      - name: Wait for GPU Node Scale Up
        run: |
          echo "Waiting for L4 GPU node pool to scale from 0 to 1..."

          for i in {1..30}; do
            GPU_NODES=$(kubectl get nodes \
              -l cloud.google.com/gke-accelerator=nvidia-l4 \
              --no-headers 2>/dev/null | wc -l)

            echo "Attempt $i: L4 GPU nodes found = $GPU_NODES"

            if [ "$GPU_NODES" -ge 1 ]; then
              echo "L4 GPU node successfully scaled from 0 to 1."

              kubectl get nodes \
                -l cloud.google.com/gke-accelerator=nvidia-l4 \
                -o wide

              exit 0
            fi

            sleep 20
          done

          echo "ERROR: L4 GPU node did not scale up."

          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== EVENTS ====="
          kubectl get events \
            --sort-by=.metadata.creationTimestamp

          exit 1

      - name: Wait for GPU Model Deployment
        run: |
          echo "Waiting for GPU model deployment..."

          kubectl rollout status deployment/tiny-model-gpu-server \
            --timeout=30m

      - name: Verify GPU Model
        run: |
          echo "===== FINAL DEPLOYMENT STATUS ====="
          kubectl get deployments

          echo "===== FINAL POD STATUS ====="
          kubectl get pods -o wide

          echo "===== L4 GPU NODE ====="
          kubectl get nodes \
            -l cloud.google.com/gke-accelerator=nvidia-l4 \
            -o wide

          echo "===== SERVICES ====="
          kubectl get services

      # ---------------------------------------------------------
      # GPU TRACE
      # ---------------------------------------------------------

      - name: Validate Trace File
        run: |
          if [ ! -f "Trace/tpu_trace.py" ]; then
            echo "ERROR: Trace/tpu_trace.py was not found."
            exit 1
          fi

          echo "Trace/tpu_trace.py found."

      - name: Create GPU Trace Results Directory
        run: |
          mkdir -p Trace/results

      - name: Run GPU Workload Trace
        run: |
          set -e

          echo "Starting port-forward to tiny-model-gpu-service..."

          kubectl port-forward \
            service/tiny-model-gpu-service \
            8000:8000 \
            > Trace/results/gpu-port-forward.log 2>&1 &

          PORT_FORWARD_PID=$!

          cleanup() {
            echo "Stopping port-forward..."
            kill "${PORT_FORWARD_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for GPU model endpoint..."

          ENDPOINT_READY=false

          for attempt in {1..30}; do
            if curl --silent --fail \
              http://localhost:8000/v1/models \
              > Trace/results/gpu-models-response.json; then

              echo "GPU model endpoint is ready."
              ENDPOINT_READY=true
              break
            fi

            echo "Attempt ${attempt}/30: endpoint is not ready."
            sleep 10
          done

          if [ "${ENDPOINT_READY}" != "true" ]; then
            echo "ERROR: GPU model endpoint did not become available."
            cat Trace/results/gpu-port-forward.log
            exit 1
          fi

          echo "Running 100-trace workload on L4 GPU..."

          python3 Trace/tpu_trace.py \
            --infra gpu \
            --url http://localhost:8000/v1/chat/completions \
            | tee Trace/results/gpu-trace-console.txt

          echo "GPU workload trace completed."

      - name: Collect GPU Trace Results
        if: always()
        run: |
          echo "Collecting generated GPU result files..."

          mv results_gpu_*.json Trace/results/ 2>/dev/null || true
          mv results_gpu_*.txt Trace/results/ 2>/dev/null || true

          echo "===== GPU TRACE RESULT FILES ====="

          find Trace/results \
            -maxdepth 1 \
            -type f \
            -print

      - name: Upload GPU Trace Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-trace-${{ github.run_number }}
          path: Trace/results/
          retention-days: 7
          if-no-files-found: warn

      # ---------------------------------------------------------
      # FAILURE DIAGNOSTICS
      # ---------------------------------------------------------

      - name: Collect Kubernetes Diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics

          kubectl get nodes -o wide \
            > diagnostics/nodes.txt 2>&1 || true

          kubectl get pods -A -o wide \
            > diagnostics/pods.txt 2>&1 || true

          kubectl get services -A \
            > diagnostics/services.txt 2>&1 || true

          kubectl get events -A \
            --sort-by=.metadata.creationTimestamp \
            > diagnostics/events.txt 2>&1 || true

          kubectl logs deployment/tiny-model-gpu-server \
            --tail=500 \
            > diagnostics/model-logs.txt 2>&1 || true

      - name: Upload Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-diagnostics-${{ github.run_number }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: ignore
